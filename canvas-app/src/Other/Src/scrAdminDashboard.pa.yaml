                  {Label: "Office", Value: Coalesce(galSites_1.Selected.Office, "-")},
                  {Label: "Attestation", Value: Coalesce(Text(galSites_1.Selected.'Attestation Status'), "-")},
                  {Label: "Last activity", Value: If(IsBlank(galSites_1.Selected.'Last Activity At'), "-", Text(galSites_1.Selected.'Last Activity At', "mmm d, yyyy"))},
                  {Label: "Direct owners", Value: Coalesce(Text(galSites_1.Selected.'Direct Owner Count'), "-")},
