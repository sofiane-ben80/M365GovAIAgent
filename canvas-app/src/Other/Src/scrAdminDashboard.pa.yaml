                  {Label: "Lifecycle", Value: Coalesce(Text(galSites_1.Selected.'Lifecycle Status'), "-")},
                  {Label: "Attestation expires", Value: If(IsBlank(galSites_1.Selected.'Attestation Expires At'), "-", Text(galSites_1.Selected.'Attestation Expires At', "mmm d, yyyy"))},
