    "galSites_1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        AccessibleLabel: |
            ="Governance sites"
        Default: =varSelectedSite
        DelayItemLoading: =true
        Fill: =RGBA(30, 41, 59, 1)
        Height: =536
        Items: |
            =Switch(
                varAdminFilter,
                "Ownerless", Filter('Governance Sites', (IsBlank(txtSiteSearch_1.Text) || StartsWith(sb_name, txtSiteSearch_1.Text)) && sb_effectiveownercount = 0),
                "NeedsOwners", Filter('Governance Sites', (IsBlank(txtSiteSearch_1.Text) || StartsWith(sb_name, txtSiteSearch_1.Text)) && sb_effectiveownercount < 2),
                "Stale", Filter('Governance Sites', (IsBlank(txtSiteSearch_1.Text) || StartsWith(sb_name, txtSiteSearch_1.Text)) && (sb_recommendedaction = 'Recommended Action (Governance Sites)'.Archive || sb_recommendedaction = 'Recommended Action (Governance Sites)'.DeleteReview)),
                "External", Filter('Governance Sites', (IsBlank(txtSiteSearch_1.Text) || StartsWith(sb_name, txtSiteSearch_1.Text)) && sb_externalsharing <> 'External Sharing (Governance Sites)'.Disabled && sb_externalsharing <> 'External Sharing (Governance Sites)'.Unknown),
                "NonCompliant", Filter('Governance Sites', (IsBlank(txtSiteSearch_1.Text) || StartsWith(sb_name, txtSiteSearch_1.Text)) && sb_compliancestatus = 'Compliance Status (Governance Sites)'.NonCompliant),
                Filter('Governance Sites', IsBlank(txtSiteSearch_1.Text) || StartsWith(sb_name, txtSiteSearch_1.Text))
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(varSelectedSite, ThisItem);
            Set(varChatContextVersion, Coalesce(varChatContextVersion, 0) + 1)
        TabIndex: |
            =0
        TemplatePadding: =0
        TemplateSize: =56
        Width: =320
        X: =20
        Y: =208
        ZIndex: =10

        Rectangle1_1 As rectangle:
            Fill: =RGBA(96, 165, 250, 1)
            Height: =Parent.TemplateHeight - Separator1_1.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =1

        Image1_1 As image:
            Height: =32
            Image: |
                =Blank()
