    "AgentChatOwner As 'Governor365 Agent Chat'":
        contextJson: |-
            =JSON(
                {
                    schemaVersion: 1,
                    screen: App.ActiveScreen.Name,
                    persona: "Owner",
                    activeFilter: varOwnerFilter,
                    siteId: If(IsBlank(galSites.Selected), Blank(), Text(galSites.Selected.sb_governancesiteid)),
                    siteName: If(IsBlank(galSites.Selected), Blank(), galSites.Selected.sb_name)
                },
                JSONFormat.Compact
            )
        contextVersion: =varChatContextVersion
        DisplayMode: =DisplayMode.Edit
        Height: =592
        locale: ="en-US"
        OnAgentAction: |-
            =With(
                { action: ParseJSON(AgentChatOwner.lastActionJson) },
                Switch(
                    Text(action.name),
                    "openSite",
                        With(
                            { requestedSiteId: IfError(GUID(Text(action.payload.siteId)), Blank()) },
                            If(
                                IsBlank(requestedSiteId),
                                Notify("The agent supplied an invalid site identifier.", NotificationType.Error),
                                Set(
                                    varSelectedSite,
                                    LookUp('Governance Sites', sb_governancesiteid = requestedSiteId)
                                );
                                If(
                                    IsBlank(varSelectedSite),
                                    Notify("The requested site is not available.", NotificationType.Error),
                                    Reset(galSites);
                                    Set(varChatContextVersion, Coalesce(varChatContextVersion, 0) + 1)
                                )
                            )
                        ),
                    "refreshSites",
                        Refresh('Governance Sites');
                        Set(varChatContextVersion, Coalesce(varChatContextVersion, 0) + 1),
                    Notify("The agent requested an unsupported app action.", NotificationType.Warning)
                )
            )
        OnConnectionStatusChanged: |-
            =If(
                AgentChatOwner.connectionStatus = "error",
                Notify(
                    If(
                        IsBlank(AgentChatOwner.lastError),
                        "Unable to connect to Governor365.",
                        AgentChatOwner.lastError
                    ),
                    NotificationType.Error
                )
            )
        promptText: =varChatPromptText
        promptVersion: =varChatPromptVersion
        ssoClientId: ="f104fe0a-6b8a-446b-a623-cfbd7c7e2b11"
        ssoLoginHint: =User().Email
        ssoRedirectUri: |-
            ="https://runtime-app.powerplatform.com/"
        ssoTenantId: ="8221c52a-2c7f-4da0-8b1f-34c6f692d915"
        title: ="Governor365 assistant"
        tokenEndpoint: |-
            ="https://9417045e87bbeac8bda1850674b114.05.environment.api.powerplatform.com/powervirtualagents/botsbyschema/copilots_header_04c70/directline/token?api-version=2022-03-01-preview"
        userDisplayName: =User().FullName
        userId: =User().Email
        Width: =422
        X: =924
        Y: =152
        ZIndex: =14
