scrDashboard As screen:
    Fill: =RGBA(15, 23, 42, 1)
    OnVisible: |-
        =If(IsBlank(varOwnerFilter), Set(varOwnerFilter, "All"));
        Set(varChatPromptText, "");
        Set(varChatContextVersion, Coalesce(varChatContextVersion, 0) + 1)

    "galSites As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        AccessibleLabel: |
            ="Governance sites"
        Default: =varSelectedSite
        DelayItemLoading: =true
        Fill: =RGBA(30, 41, 59, 1)
        Height: =536
        Items: |
            =Switch(
                varOwnerFilter,
                "NeedsOwners", Filter('Governance Sites', (IsBlank(txtSiteSearch.Text) || StartsWith(sb_name, txtSiteSearch.Text)) && sb_effectiveownercount < 2),
                "Stale", Filter('Governance Sites', (IsBlank(txtSiteSearch.Text) || StartsWith(sb_name, txtSiteSearch.Text)) && (sb_recommendedaction = 'Recommended Action (Governance Sites)'.Archive || sb_recommendedaction = 'Recommended Action (Governance Sites)'.DeleteReview)),
                "External", Filter('Governance Sites', (IsBlank(txtSiteSearch.Text) || StartsWith(sb_name, txtSiteSearch.Text)) && sb_externalsharing <> 'External Sharing (Governance Sites)'.Disabled && sb_externalsharing <> 'External Sharing (Governance Sites)'.Unknown),
                "NonCompliant", Filter('Governance Sites', (IsBlank(txtSiteSearch.Text) || StartsWith(sb_name, txtSiteSearch.Text)) && sb_compliancestatus = 'Compliance Status (Governance Sites)'.NonCompliant),
                "Attestation", Filter('Governance Sites', (IsBlank(txtSiteSearch.Text) || StartsWith(sb_name, txtSiteSearch.Text)) && (sb_attestationstatus = 'Attestation Status (Governance Sites)'.NotAttested || sb_attestationstatus = 'Attestation Status (Governance Sites)'.Expired)),
                Filter('Governance Sites', IsBlank(txtSiteSearch.Text) || StartsWith(sb_name, txtSiteSearch.Text))
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(varSelectedSite, ThisItem);
            Set(varChatContextVersion, Coalesce(varChatContextVersion, 0) + 1)
        TabIndex: |
            =0
        TemplatePadding: =0
        TemplateSize: =56
        Width: =320
        X: =20
        Y: =208
        ZIndex: =1

        Image1 As image:
            Height: =40
            Image: |
                =Blank()
            OnSelect: =Select(Parent)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =false
            Width: =40
            X: =12
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            ZIndex: =1

        Title1 As label:
            Color: =RGBA(248, 250, 252, 1)
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =22
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: |
                =ThisItem.sb_name
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 56
            X: =16
            Y: =7
            ZIndex: =2

        Subtitle1 As label:
            Color: =RGBA(148, 163, 184, 1)
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =18
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =9
            Text: |
                =With(
                    {
                        tenantUrl: Match(
                            ThisItem.sb_siteurl,
                            "^https?://[^/]+",
                            MatchOptions.IgnoreCase
                        ).FullMatch
                    },
                    With(
                        {relativePath: Substitute(ThisItem.sb_siteurl, tenantUrl, "")},
                        If(IsBlank(relativePath), "/", relativePath)
                    )
                )
            VerticalAlign: =VerticalAlign.Top
            Width: =Title1.Width
            X: =Title1.X
            Y: =29
            ZIndex: =3

        NextArrow1 As icon.ChevronRight:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(148, 163, 184, 1)
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(119, 119, 119, 1)
            Height: =32
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =9
            PaddingLeft: =9
            PaddingRight: =9
            PaddingTop: =9
            Tooltip: ="View item details"
            Width: =32
            X: =Parent.TemplateWidth - Self.Width - 4
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            ZIndex: =4

        Separator1 As rectangle:
            Fill: =RGBA(51, 65, 85, 1)
            Height: =1
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =5

        Rectangle1 As rectangle:
            Fill: =RGBA(96, 165, 250, 1)
            Height: =Parent.TemplateHeight - Separator1.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =6

