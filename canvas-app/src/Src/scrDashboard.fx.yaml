    btnOwnerAssessSite As button:
        BorderThickness: =0
        DisplayMode: =If(IsBlank(galSites.Selected), DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =RGBA(37, 99, 235, 1)
        Height: =44
        HoverFill: =ColorFade(Self.Fill, -10%)
        OnSelect: |-
            =Set(
                varChatPromptText,
                "Delegate this request to Owner Operations for an exact-site governance review. Site ID: " &
                Text(galSites.Selected.sb_governancesiteid) &
                ". Retrieve this live Governor365 Dataverse record by ID. Do not list sites or substitute another site. Return only the site's evidence, risk analysis, policy recommendation comparison, and prioritized remediation. Do not make changes."
            );
            Set(varChatPromptVersion, Coalesce(varChatPromptVersion, 0) + 1)
        Size: =12
        Text: ="Assess selected site"
        Tooltip: ="Ask the assistant for a live, evidence-based assessment of the selected site"
        Width: =267
        X: =352
        Y: =152
        ZIndex: =11

    btnOwnerTakeAction As button:
        BorderThickness: =0
        DisplayMode: =If(IsBlank(galSites.Selected), DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =RGBA(5, 150, 105, 1)
        Height: =44
        HoverFill: =ColorFade(Self.Fill, -10%)
        OnSelect: |-
            =Set(
                varChatPromptText,
                "Delegate this request to Owner Operations to start a governed action for the exact site. Site ID: " &
                Text(galSites.Selected.sb_governancesiteid) &
                ". Retrieve and authorize this live Governor365 Dataverse record by ID. Do not list sites. Prompt me to choose Certify, Archive, Deletion review, Assign owners, or Cancel. This is a mock action-intent interaction only; acknowledge my choice and do not submit a request or make changes."
            );
            Set(varChatPromptVersion, Coalesce(varChatPromptVersion, 0) + 1)
        Size: =12
        Text: ="Help me take action"
        Tooltip: ="Ask Owner Operations to capture a governed action intent for the selected site"
        Width: =267
        X: =633
        Y: =152
        ZIndex: =12

