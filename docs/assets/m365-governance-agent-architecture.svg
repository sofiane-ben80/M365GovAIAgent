  <text x="225" y="828" class="t dark" text-anchor="middle">Normalized, approved access</text>
  <text x="225" y="852" class="t dark" text-anchor="middle">for specialist agents</text>
  <rect x="455" y="758" width="310" height="112" class="box" fill="#fff" stroke="#605e5c"/>
  <text x="610" y="798" class="h dark" text-anchor="middle">Power Automate</text>
  <text x="610" y="828" class="t dark" text-anchor="middle">Flows and connectors</text>
  <text x="610" y="852" class="t dark" text-anchor="middle">Approved action contracts</text>
  <rect x="840" y="758" width="310" height="112" class="box" fill="#fff" stroke="#605e5c"/>
  <text x="995" y="798" class="h dark" text-anchor="middle">Microsoft Dataverse</text>
  <text x="995" y="828" class="t dark" text-anchor="middle">Sites • owners • requests</text>
  <text x="995" y="852" class="t dark" text-anchor="middle">Policy • evidence • audit events</text>
  <rect x="1225" y="758" width="300" height="112" class="box" fill="#fff" stroke="#605e5c"/>
  <text x="1375" y="798" class="h dark" text-anchor="middle">Structured response</text>
  <text x="1375" y="828" class="t dark" text-anchor="middle">Adaptive Cards</text>
