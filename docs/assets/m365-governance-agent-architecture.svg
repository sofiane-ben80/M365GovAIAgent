  <text x="1030" y="514" class="h light" text-anchor="middle">Data Protection</text><text x="1030" y="540" class="t light" text-anchor="middle">Classification and sharing</text>
  <rect x="1185" y="480" width="300" height="80" class="box" fill="#008575" stroke="#005b50"/>
  <text x="1335" y="514" class="h light" text-anchor="middle">Identity Governance</text><text x="1335" y="540" class="t light" text-anchor="middle">Roles, access, ownership</text>
  <rect x="1040" y="582" width="330" height="80" class="box" fill="#008575" stroke="#005b50"/>
  <text x="1205" y="616" class="h light" text-anchor="middle">Security &amp; Compliance</text><text x="1205" y="642" class="t light" text-anchor="middle">Control assurance</text>

