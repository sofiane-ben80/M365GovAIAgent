  <text x="252" y="418" class="h light" text-anchor="middle">Governance Owner Agent</text>
  <text x="252" y="451" class="t light" text-anchor="middle">Portfolio • assessment • explanations</text>
  <text x="252" y="477" class="t light" text-anchor="middle">Support • action tracking</text>
  <text x="252" y="503" class="t light" text-anchor="middle">Disposition requests</text>

