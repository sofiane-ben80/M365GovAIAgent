  <text x="70" y="733" class="section">SHARED GOVERNED EVIDENCE &amp; AUTOMATION</text>

  <rect x="70" y="920" width="1455" height="44" rx="10" fill="#edebe9"/>
  <text x="797" y="948" class="t dark" text-anchor="middle">Human accountability • role-aware access • reusable actions • governed evidence • auditable outcomes</text>
