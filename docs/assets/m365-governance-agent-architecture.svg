<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">M365 Governance multi-agent architecture</title>
  <desc id="desc">A Power Platform-native M365 Governance orchestrator routes users to Owner, Admin, and specialist agents. Power Automate connects them to Dataverse and governed Microsoft 365 APIs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#605e5c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".15"/>
    </filter>
    <style>
      .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#242424}.subtitle{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#605e5c}
      .box{rx:16;filter:url(#shadow);stroke-width:2}.h{font:700 20px 'Segoe UI',Arial,sans-serif}.t{font:400 15px 'Segoe UI',Arial,sans-serif}
      .light{fill:#fff}.dark{fill:#242424}.line{fill:none;stroke:#605e5c;stroke-width:2.5;marker-end:url(#arrow)}
      .section{font:700 17px 'Segoe UI',Arial,sans-serif;letter-spacing:1.5px;fill:#605e5c}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#faf9f8"/>
  <text x="70" y="62" class="title">M365 Governance AI Agent Architecture</text>
  <text x="70" y="96" class="subtitle">Copilot Studio, Dataverse, Power Automate, Power Apps, and Teams</text>

  <text x="70" y="145" class="section">EXPERIENCE &amp; ORCHESTRATION</text>
  <rect x="70" y="170" width="270" height="112" class="box" fill="#fff" stroke="#8a8886"/>
  <text x="205" y="207" class="h dark" text-anchor="middle">Users</text>
  <text x="205" y="236" class="t dark" text-anchor="middle">Site owners</text>
  <text x="205" y="260" class="t dark" text-anchor="middle">Governance administrators</text>

  <rect x="470" y="150" width="440" height="152" class="box" fill="#5b2c83" stroke="#35134f"/>
  <text x="690" y="194" class="h light" text-anchor="middle">M365 Governance Agent</text>
  <text x="690" y="224" class="t light" text-anchor="middle">Orchestrator / launcher</text>
  <text x="690" y="252" class="t light" text-anchor="middle">Intent classification • role-aware routing</text>
  <text x="690" y="276" class="t light" text-anchor="middle">Consolidated conversational response</text>

  <rect x="1040" y="170" width="310" height="112" class="box" fill="#704c9f" stroke="#35134f"/>
