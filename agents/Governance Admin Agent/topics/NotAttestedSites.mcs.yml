mcs.metadata:
  componentName: Not Attested Sites
  description: Returns sites whose attestation is missing, expired, or otherwise needs admin review.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Not Attested Sites
    includeInOnSelectIntent: false
    triggerQueries:
      - not attested sites
      - show not attested sites
      - attestation overdue
      - sites not attested
      - attested sites missing

  actions:
    - kind: SetVariable
      id: setVariable_NotAttestedCallerUpn
      variable: Topic.CallerUPN
      value: =System.User.PrincipalName

    - kind: SetVariable
      id: setVariable_NotAttestedRecordCount
      variable: init:Topic.RecordCount
      value: 0

    - kind: InvokeFlowAction
      id: invokeFlowAction_ListAttestationSites
      input:
        binding:
          number: =20
          number_1: =365
          text: =Topic.CallerUPN
          text_1: ="ATTESTATION"
          text_2: =""
          text_3: =""
          text_4: ="NONE"

      output:
        binding:
          correlationid: Topic.CorrelationId
          datajson: Topic.DataJson
          message: Topic.ResultMessage
          recordcount: Topic.RecordCount
          status: Topic.ResultStatus
          success: Topic.Success

      flowId: 364a1e5b-b9b3-f111-aaac-000d3a367627

    - kind: ConditionGroup
      id: conditionGroup_AttestationResult
      conditions:
        - id: conditionItem_AttestationFailed
          condition: =Topic.Success <> true
          actions:
            - kind: SendActivity
              id: sendActivity_AttestationFailed
              activity: "{Topic.ResultMessage} Status: {Topic.ResultStatus}. Correlation ID: {Topic.CorrelationId}"

      elseActions:
        - kind: ConditionGroup
          id: conditionGroup_AttestationEmpty
          conditions:
            - id: conditionItem_AttestationEmpty
              condition: =Topic.RecordCount = 0
              actions:
                - kind: SendActivity
                  id: sendActivity_AttestationEmpty
                  activity: No sites currently require attestation review.

          elseActions:
            - kind: SendActivity
              id: sendActivity_AttestationResult
              activity:
                attachments:
                  - kind: AdaptiveCardTemplate
                    cardContent: |-
                      ={
                        '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                        type: "AdaptiveCard",
                        version: "1.5",
                        body: Table(
                          {
                            type: "TextBlock",
                            text: "Sites requiring attestation",
                            size: "Large",
                            weight: "Bolder",
                            wrap: true
                          },
                          {
                            type: "TextBlock",
                            text: Text(Topic.RecordCount) & " site(s) need review",
                            isSubtle: true,
                            spacing: "None",
                            wrap: true
                          },
                          {
                            type: "Container",
                            items: ForAll(
                              FirstN(Table(ParseJSON(Topic.DataJson)), 10) As site,
                              {
                                type: "Container",
                                separator: true,
                                spacing: "Medium",
                                items: Table(
                                  {
                                    type: "TextBlock",
                                    text: Text(site.Value.sb_name),
                                    weight: "Bolder",
                                    wrap: true
                                  },
                                  {
                                    type: "FactSet",
                                    facts: Table(
                                      {
                                        title: "Attestation",
                                        value: Switch(
                                          Text(site.Value.sb_attestationstatus),
                                          "100000000", "Not attested",
                                          "100000001", "Attested",
                                          "100000002", "Expired",
                                          "100000003", "Exempt",
                                          "100000004", "Unknown",
                                          "Not available"
                                        )
                                      },
                                      {
                                        title: "Expires",
                                        value: Coalesce(Text(site.Value.sb_attestationexpiresat), "Not available")
                                      },
                                      {
                                        title: "Recommended action",
                                        value: Switch(
                                          Text(site.Value.sb_recommendedaction),
                                          "100000000", "None",
                                          "100000001", "Certify",
                                          "100000002", "Archive",
                                          "100000003", "Deletion review",
                                          "100000004", "Assign owners",
                                          "Review attestation"
                                        )
                                      }
                                    )
                                  },
                                  {
                                    type: "ActionSet",
                                    actions: Table(
                                      {
                                        type: "Action.OpenUrl",
                                        title: "Open site",
                                        url: Text(site.Value.sb_siteurl)
                                      }
                                    )
                                  }
                                )
                              }
                            )
                          }
                        )
                      }

    - kind: CancelAllDialogs
      id: cancelAllDialogs_NotAttestedSites