mcs.metadata:
  componentName: Orphaned Sites
  description: Returns sites with no owners so admins can decide whether to assign, archive, or delete.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Orphaned Sites
    includeInOnSelectIntent: false
    triggerQueries:
      - orphaned sites
      - show orphaned sites
      - sites with no owners
      - missing owners
      - sites needing owners

  actions:
    - kind: SetVariable
      id: setVariable_OrphanedCallerUpn
      variable: init:Topic.CallerUPN
      value: =System.User.PrincipalName

    - kind: SetVariable
      id: setVariable_OrphanedPageNumber
      variable: Topic.PageNumber
      value: "1"

    - kind: SetVariable
      id: setVariable_OrphanedPageSize
      variable: Topic.PageSize
      value: "10"

    - kind: SetVariable
      id: setVariable_OrphanedRecordCount
      variable: init:Topic.RecordCount
      value: 0

    - kind: InvokeFlowAction
      id: invokeFlowAction_ListOrphanedSites
      input:
        binding:
          number: =20
          number_1: =365
          text: =Topic.CallerUPN
          text_1: ="ORPHANED"
          text_2: =""
          text_3: =""
          text_4: ="NONE"

      output:
        binding:
          correlationid: Topic.CorrelationId
          datajson: Topic.DataJson
          message: Topic.ResultMessage
          recordcount: Topic.RecordCount
          status: Topic.ResultStatus
          success: Topic.Success

      flowId: 364a1e5b-b9b3-f111-aaac-000d3a367627

    - kind: ConditionGroup
      id: conditionGroup_OrphanedResult
      conditions:
        - id: conditionItem_OrphanedFailed
          condition: =Topic.Success <> true
          actions:
            - kind: SendActivity
              id: sendActivity_OrphanedFailed
              activity: "{Topic.ResultMessage} Status: {Topic.ResultStatus}. Correlation ID: {Topic.CorrelationId}"

      elseActions:
        - kind: ConditionGroup
          id: conditionGroup_OrphanedEmpty
          conditions:
            - id: conditionItem_OrphanedEmpty
              condition: =Topic.RecordCount = 0
              actions:
                - kind: SendActivity
                  id: sendActivity_OrphanedEmpty
                  activity: No orphaned sites were found.

          elseActions:
            - kind: SendActivity
              id: sendActivity_OrphanedResult
              activity:
                attachments:
                  - kind: AdaptiveCardTemplate
                    cardContent: |-
                      ={
                        '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                        type: "AdaptiveCard",
                        version: "1.5",
                        body: Table(
                          {
                            type: "TextBlock",
                            text: "Orphaned sites",
                            size: "Large",
                            weight: "Bolder",
                            wrap: true
                          },
                          {
                            type: "TextBlock",
                            text: Text(Topic.RecordCount) & " site(s) need an owner",
                            isSubtle: true,
                            spacing: "None",
                            wrap: true
                          },
                          {
                            type: "Container",
                            items: ForAll(
                              FirstN(Table(ParseJSON(Topic.DataJson)), 10) As site,
                              {
                                type: "Container",
                                separator: true,
                                spacing: "Medium",
                                items: Table(
                                  {
                                    type: "TextBlock",
                                    text: Text(site.Value.sb_name),
                                    weight: "Bolder",
                                    wrap: true
                                  },
                                  {
                                    type: "FactSet",
                                    facts: Table(
                                      {
                                        title: "Office",
                                        value: Coalesce(Text(site.Value.sb_office), "Not available")
                                      },
                                      {
                                        title: "Last activity",
                                        value: Coalesce(Text(site.Value.sb_lastactivityat), "Not available")
                                      },
                                      {
                                        title: "Recommended action",
                                        value: Switch(
                                          Text(site.Value.sb_recommendedaction),
                                          "100000000", "None",
                                          "100000001", "Certify",
                                          "100000002", "Archive",
                                          "100000003", "Deletion review",
                                          "100000004", "Assign owners",
                                          "Assign owners"
                                        )
                                      }
                                    )
                                  },
                                  {
                                    type: "ActionSet",
                                    actions: Table(
                                      {
                                        type: "Action.OpenUrl",
                                        title: "Open site",
                                        url: Text(site.Value.sb_siteurl)
                                      }
                                    )
                                  }
                                )
                              }
                            )
                          }
                        )
                      }

    - kind: CancelAllDialogs
      id: cancelAllDialogs_OrphanedSites