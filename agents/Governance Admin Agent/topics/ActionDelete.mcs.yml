mcs.metadata:
  componentName: Action Delete
  description: Action Agent scaffold for confirming and executing a deletion request review.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Action Delete
    includeInOnSelectIntent: false
    triggerQueries:
      - execute delete
      - action delete
      - confirm delete

  actions:
    - kind: SetVariable
      id: setVariable_ActionDeleteCallerUpn
      variable: init:Topic.CallerUPN
      value: =System.User.PrincipalName

    - kind: SetTextVariable
      id: setTextVariable_ActionType
      variable: Topic.ActionType
      value: DELETE-REQUESTED

    - kind: SetTextVariable
      id: setTextVariable_ActionStatus
      variable: Topic.ActionStatus
      value: READY

    - kind: SetTextVariable
      id: setTextVariable_ActionDeleteSiteUrl
      variable: Topic.SelectedSiteUrl
      value: <selected-site-url>

    - kind: SetTextVariable
      id: setTextVariable_ActionDeleteSiteTitle
      variable: Topic.SelectedSiteTitle
      value: <selected-site-title>

    - kind: SetTextVariable
      id: setTextVariable_ActionDeleteSiteItemId
      variable: Topic.SelectedSiteItemId
      value: <selected-site-item-id>

    - kind: SendActivity
      id: sendActivity_ActionDeleteIntro
      activity: |
        This topic is reserved for the Action Agent handoff.
        It will enforce the delete confirmation path before any downstream review or approval step.

    - kind: SendActivity
      id: sendActivity_ActionDeletePending
      activity: |
        Planned inputs:
        - Caller UPN: {Topic.CallerUPN}
        - Site URL: {Topic.SelectedSiteUrl}
        - Site Title: {Topic.SelectedSiteTitle}
        - Site Item ID: {Topic.SelectedSiteItemId}

    - kind: CancelAllDialogs
      id: cancelAllDialogs_ActionDelete
