mcs.metadata:
  componentName: My Sites
  description: Returns the signed-in user's SharePoint sites and their governance status.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: My Sites
    includeInOnSelectIntent: false
    triggerQueries:
      - show my sites
      - my sites
      - what sites do i own
      - what do i own
      - list my sharepoint sites

  actions:
    - kind: SetVariable
      id: setVariable_MySitesCallerUpn
      variable: Topic.CallerUPN
      value: =System.User.PrincipalName

    - kind: SetVariable
      id: setVariable_PageNumber
      variable: Topic.PageNumber
      value: "1"

    - kind: SetVariable
      id: setVariable_PageSize
      variable: Topic.PageSize
      value: "10"

    - kind: SetVariable
      id: setVariable_SitesJson
      variable: Topic.SitesJson
      value: "[]"

    - kind: SetVariable
      id: setVariable_RecordCount
      variable: init:Topic.RecordCount
      value: 0

    - kind: SendActivity
      id: sendActivity_MySitesLoading
      activity: Loading your sites...

    - kind: InvokeFlowAction
      id: invokeFlowAction_7bs5Hg
      input:
        binding:
          number: =20
          text: =Topic.CallerUPN
          text_2: =""

      output:
        binding:
          continuationtoken: Topic.ContinuationToken
          correlationid: Topic.CorrelationId
          datajson: Topic.DataJson
          message: Topic.ResultMessage
          recordcount: Topic.RecordCount
          status: Topic.ResultStatus
          success: Topic.Success

      flowId: 68784ae7-b8b3-f111-aaac-000d3a367627

    - kind: ConditionGroup
      id: conditionGroup_MySitesResult
      conditions:
        - id: conditionItem_MySitesFailed
          condition: =Lower(Text(Topic.Success)) <> "true"
          actions:
            - kind: SendActivity
              id: sendActivity_MySitesFailed
              activity: |
                I could not load your governed sites. {Topic.ResultMessage}
                Status: {Topic.ResultStatus}
                Correlation ID: {Topic.CorrelationId}

            - kind: CancelAllDialogs
              id: cancelAllDialogs_MySitesFailed

        - id: conditionItem_MySitesEmpty
          condition: =Topic.RecordCount = 0
          actions:
            - kind: SendActivity
              id: sendActivity_MySitesEmpty
              activity: No active governed sites are assigned to your signed-in account.

            - kind: CancelAllDialogs
              id: cancelAllDialogs_MySitesEmpty

    - kind: SetVariable
      id: setVariable_xezsih
      variable: Topic.SitesJson
      value: =Topic.DataJson

    - kind: SendActivity
      id: sendActivity_MySitesList
      activity:
        attachments:
          - kind: AdaptiveCardTemplate
            cardContent: |-
              ={
                '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.5",
                body: Table(
                  {
                    type: "Container",
                    bleed: true,
                    style: "emphasis",
                    items: Table(
                      {
                        type: "TextBlock",
                        text: "Your Sites",
                        size: "ExtraLarge",
                        weight: "Bolder",
                        wrap: true
                      },
                      {
                        type: "TextBlock",
                        text: Text(Topic.RecordCount) & " site(s) returned",
                        size: "Small",
                        isSubtle: true,
                        spacing: "None",
                        wrap: true
                      }
                    )
                  },
                  {
                    type: "Container",
                    items: ForAll(
                      FirstN(Table(ParseJSON(Topic.SitesJson)), Value(Topic.PageSize)) As site,
                      {
                        type: "Container",
                        spacing: "Medium",
                        separator: true,
                        items: Table(
                          {
                            type: "ColumnSet",
                            columns: Table(
                              {
                                type: "Column",
                                width: "stretch",
                                items: Table(
                                  {
                                    type: "TextBlock",
                                    text: Text(site.Value.sb_site.sb_name),
                                    size: "Medium",
                                    weight: "Bolder",
                                    wrap: true
                                  },
                                  {
                                    type: "TextBlock",
                                    text: "Governed SharePoint site",
                                    size: "Small",
                                    color: "Accent",
                                    isSubtle: true,
                                    spacing: "None",
                                    wrap: true
                                  }
                                )
                              },
                              {
                                type: "Column",
                                width: "auto",
                                verticalContentAlignment: "Top",
                                items: Table(
                                  {
                                    type: "TextBlock",
                                    text: Switch(
                                      Text(site.Value.sb_site.sb_compliancestatus),
                                      "100000000", "Compliant",
                                      "100000001", "Non-compliant",
                                      "100000002", "Unknown",
                                      "Not available"
                                    ),
                                    weight: "Bolder",
                                    color: If(Text(site.Value.sb_site.sb_compliancestatus) = "100000000", "Good", "Attention"),
                                    horizontalAlignment: "Right",
                                    wrap: true
                                  }
                                )
                              }
                            )
                          },
                          {
                            type: "FactSet",
                            spacing: "Small",
                            facts: Table(
                              {
                                title: "Last activity",
                                value: Text(site.Value.sb_site.sb_lastactivityat)
                              },
                              {
                                title: "Recommended action",
                                value: Switch(
                                  Text(site.Value.sb_site.sb_recommendedaction),
                                  "100000000", "None",
                                  "100000001", "Certify",
                                  "100000002", "Archive",
                                  "100000003", "Deletion review",
                                  "100000004", "Assign owners",
                                  "Not available"
                                )
                              }
                            )
                          },
                          {
                            type: "ActionSet",
                            spacing: "Small",
                            actions: Table(
                              {
                                type: "Action.Submit",
                                title: "View details",
                                data: {
                                  actionSubmitId: "my_sites_view_details",
                                  intent: "siteDetail",
                                  targetTopic: "SiteDetail",
                                  selectedSiteItemId: Text(site.Value.sb_site.sb_governancesiteid),
                                  selectedSiteTitle: Text(site.Value.sb_site.sb_name),
                                  selectedSiteUrl: Text(site.Value.sb_site.sb_siteurl)
                                }
                              },
                              {
                                type: "Action.OpenUrl",
                                title: "Open site",
                                url: Text(site.Value.sb_site.sb_siteurl)
                              }
                            )
                          },
                          {
                            type: "ActionSet",
                            spacing: "Small",
                            actions: Table(
                              {
                                type: "Action.Submit",
                                title: "Request archive",
                                data: {
                                  actionSubmitId: "my_sites_request_archive",
                                  intent: "requestArchival",
                                  targetTopic: "RequestArchival",
                                  selectedSiteItemId: Text(site.Value.sb_site.sb_governancesiteid),
                                  selectedSiteTitle: Text(site.Value.sb_site.sb_name),
                                  selectedSiteUrl: Text(site.Value.sb_site.sb_siteurl)
                                }
                              },
                              {
                                type: "Action.Submit",
                                title: "Request deletion review",
                                data: {
                                  actionSubmitId: "my_sites_request_deletion",
                                  intent: "requestDeletionReview",
                                  targetTopic: "FlagForDeletion",
                                  selectedSiteItemId: Text(site.Value.sb_site.sb_governancesiteid),
                                  selectedSiteTitle: Text(site.Value.sb_site.sb_name),
                                  selectedSiteUrl: Text(site.Value.sb_site.sb_siteurl)
                                }
                              }
                            )
                          }
                        )
                      }
                    )
                  }
                )
              }

    - kind: CancelAllDialogs
      id: cancelAllDialogs_MySites