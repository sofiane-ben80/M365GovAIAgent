mcs.metadata:
  componentName: Sites Needing Attention
  description: Returns only the signed-in user's sites that need a governance action.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Sites Needing Attention
    includeInOnSelectIntent: false
    triggerQueries:
      - show sites needing attention
      - sites needing attention
      - show my non-compliant sites
      - what needs attention
      - at risk sites

  actions:
    - kind: SetVariable
      id: setVariable_AttentionCallerUpn
      variable: Topic.CallerUPN
      value: =System.User.PrincipalName

    - kind: SetVariable
      id: setVariable_AttentionRecordCount
      variable: init:Topic.RecordCount
      value: 0

    - kind: InvokeFlowAction
      id: invokeFlowAction_ListOwnerAttentionSites
      input:
        binding:
          number: =20
          text: =Topic.CallerUPN
          text_2: =""

      output:
        binding:
          correlationid: Topic.CorrelationId
          datajson: Topic.DataJson
          message: Topic.ResultMessage
          recordcount: Topic.RecordCount
          status: Topic.ResultStatus
          success: Topic.Success

      flowId: 68784ae7-b8b3-f111-aaac-000d3a367627

    - kind: ConditionGroup
      id: conditionGroup_AttentionResult
      conditions:
        - id: conditionItem_AttentionFailed
          condition: =Topic.Success <> true
          actions:
            - kind: SendActivity
              id: sendActivity_AttentionFailed
              activity: "{Topic.ResultMessage} Status: {Topic.ResultStatus}. Correlation ID: {Topic.CorrelationId}"

      elseActions:
        - kind: ConditionGroup
          id: conditionGroup_AttentionEmpty
          conditions:
            - id: conditionItem_AttentionEmpty
              condition: =Topic.RecordCount = 0
              actions:
                - kind: SendActivity
                  id: sendActivity_AttentionEmpty
                  activity: None of your governed sites currently need attention.

          elseActions:
            - kind: SendActivity
              id: sendActivity_AttentionResult
              activity:
                attachments:
                  - kind: AdaptiveCardTemplate
                    cardContent: |-
                      ={
                        '$schema': "http://adaptivecards.io/schemas/adaptive-card.json",
                        type: "AdaptiveCard",
                        version: "1.5",
                        body: Table(
                          {
                            type: "TextBlock",
                            text: "Sites needing attention",
                            size: "Large",
                            weight: "Bolder",
                            wrap: true
                          },
                          {
                            type: "TextBlock",
                            text: Text(Topic.RecordCount) & " owned site(s)",
                            isSubtle: true,
                            spacing: "None",
                            wrap: true
                          },
                          {
                            type: "Container",
                            items: ForAll(
                              FirstN(Table(ParseJSON(Topic.DataJson)), 10) As assignment,
                              {
                                type: "Container",
                                separator: true,
                                spacing: "Medium",
                                items: Table(
                                  {
                                    type: "TextBlock",
                                    text: Text(assignment.Value.sb_site.sb_name),
                                    weight: "Bolder",
                                    wrap: true
                                  },
                                  {
                                    type: "FactSet",
                                    facts: Table(
                                      {
                                        title: "Compliance",
                                        value: Switch(
                                          Text(assignment.Value.sb_site.sb_compliancestatus),
                                          "100000000", "Compliant",
                                          "100000001", "Non-compliant",
                                          "100000002", "Unknown",
                                          "Not available"
                                        )
                                      },
                                      {
                                        title: "Reason",
                                        value: Coalesce(Text(assignment.Value.sb_site.sb_triagereason), "Not available")
                                      },
                                      {
                                        title: "Recommended action",
                                        value: Switch(
                                          Text(assignment.Value.sb_site.sb_recommendedaction),
                                          "100000000", "None",
                                          "100000001", "Certify",
                                          "100000002", "Archive",
                                          "100000003", "Deletion review",
                                          "100000004", "Assign owners",
                                          "Not available"
                                        )
                                      }
                                    )
                                  },
                                  {
                                    type: "ActionSet",
                                    actions: Table(
                                      {
                                        type: "Action.OpenUrl",
                                        title: "Open site",
                                        url: Text(assignment.Value.sb_site.sb_siteurl)
                                      }
                                    )
                                  }
                                )
                              }
                            )
                          }
                        )
                      }

    - kind: CancelAllDialogs
      id: cancelAllDialogs_Attention